
name: Quarterly SPEC0 review
on:
  schedule:
    - cron: 0 0 1 */3 *

jobs:
  create_issue:
    name: Create SPEC0 issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create SPEC0 issue
        run: |
          new_issue_url=$(gh issue create \
            --title "$TITLE" \
            --body "$BODY")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: SPEC0 review
          BODY: |
            ### Review the SPEC0 status of packages

            Check the quarterly [SPEC0 recommendations for dropping version
            support](https://scientific-python.org/specs/spec-0000/) and update
            `pyproject.toml`.
