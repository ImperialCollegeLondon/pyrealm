default_language_version:
  # force all hooks to use Python 3.12, the minimum supported version of Python for pyrealm
  python: "3.12"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.5
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --target-version, py312]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v2.3.1"
    hooks:
      - id: mypy
        additional_dependencies: [numpy==2.1.3, types-tabulate, pandas-stubs]
        exclude: "pyrealm_build_data/splash/splash_py_version/.*\\.py"
        # https://stackoverflow.com/a/75447331/3401916
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
    - id: markdownlint
  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.5
    hooks:
    - id: jupytext
      args: [--pipe, black]
      files: docs/source
      exclude: |
            (?x)^(
                docs/source/conf.py|
                docs/source/sphinx_extensions/__init__.py|
                docs/source/sphinx_extensions/experimental.py
            )$
      additional_dependencies:
        - black==24.4.2 # Matches hook
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    - id: codespell
      args: ["--toml", "pyproject.toml"]
      additional_dependencies:
        - tomli

